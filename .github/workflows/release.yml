name: Release

# Publishes @constantine-24/ngx-datetime-picker to npm when a vX.Y.Z tag is pushed.
#
# Auth: npm trusted publishing (OIDC) only — no npm token is stored anywhere. The trusted
# publisher on npmjs.com (package → Settings → Trusted Publisher) must name GitHub owner
# "Constantine-24", repository "ngx-datetime-picker", workflow file "release.yml", no
# environment, and must allow direct `npm publish` (not only `npm stage publish`).
# No NODE_AUTH_TOKEN is needed: npm exchanges the GitHub OIDC token itself. A trusted publisher
# limited to `npm stage publish` fails here with "E403 OIDC permission denied for this action".

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # npm's guidance: never cache dependencies in release builds

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Check the tag matches the library version
        run: |
          VERSION=$(node -p "require('./projects/ngx-datetime-picker/package.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${VERSION}"
            exit 1
          fi

      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build:lib

      - name: Publish to npm
        working-directory: dist/ngx-datetime-picker
        # Prereleases (v1.2.0-rc.1) go to the "next" dist-tag so they never become "latest".
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          PRERELEASE=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES" $PRERELEASE
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
          fi
