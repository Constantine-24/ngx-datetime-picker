name: Bug report
description: Something in the picker doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! A minimal reproduction (StackBlitz or a small repo) gets it fixed fastest.
  - type: dropdown
    id: variant
    attributes:
      label: Picker variant
      multiple: true
      options: [date, date-range, time, datetime, datetime-range]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link to a StackBlitz / repo, or the smallest template + config that shows the problem.
      render: html
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: '@constantine-24/ngx-datetime-picker, @angular/core, @angular/material, temporal-polyfill (if used)'
      placeholder: 1.0.0 / 22.0.2 / 22.0.2 / 0.3.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & OS
      placeholder: Chrome 141, macOS 26
  - type: dropdown
    id: forms
    attributes:
      label: Forms API (if relevant)
      options: [Not relevant, Reactive Forms, ngModel, Signal Forms]
